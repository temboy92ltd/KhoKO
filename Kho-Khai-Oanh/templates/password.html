{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Đổi mật khẩu</h1></div><section class="panel form-panel narrow"><form method="post">{{ csrf_field() }}<label>Mật khẩu hiện tại<input name="current" type="password" required autocomplete="current-password"></label><label>Mật khẩu mới<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><label>Xác nhận mật khẩu mới<input name="confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button class="button">Lưu mật khẩu</button></form></section>{% endblock %}
